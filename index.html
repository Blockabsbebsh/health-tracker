<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Tracker</title>
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.05);
  --accent:#2a78d6; --accent-ink:#fff; --band:rgba(11,11,11,.07);
  --warn-bg:#fdf0d2; --warn-ink:#6b4700; --ok-bg:#e3f3e3; --ok-ink:#006300; --danger:#d03b3b;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.06);
  --accent:#3987e5; --band:rgba(255,255,255,.08);
  --warn-bg:#3b2c08; --warn-ink:#fab219; --ok-bg:#12301a; --ok-ink:#0ca30c; --danger:#e66767;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 2px}
h2{font-size:15px;margin:22px 0 8px;color:var(--ink2);font-weight:600}
.sub{color:var(--ink2);font-size:14px;margin:0 0 14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h1{flex:1;margin:0}
.back{background:none;border:0;color:var(--accent);font:inherit;padding:8px 8px 8px 0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile .l{font-size:13px;color:var(--ink2)}
.tile .v{font-size:24px;font-weight:600;line-height:1.2;margin:2px 0}
.tile .v small{font-size:14px;font-weight:500;color:var(--ink2)}
.tile .d{font-size:13px;color:var(--ink2)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--border);
  background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:52px}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}
.row .t{display:block;font-weight:600;overflow-wrap:anywhere}
.row .s{display:block;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .r b{font-size:17px}
.row .r span{font-size:13px;color:var(--ink2)}
.chev{color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--wash);color:var(--ink2);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--axis);flex:none;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700}
.row.on .check{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--ink2);font-size:14px;text-align:center;padding:22px 14px}
.note{font-size:13px;color:var(--ink2);margin:6px 2px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:999px;padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
/* charts */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .end{fill:var(--ink);font-weight:600;font-size:12px}
.chart .cross{stroke:var(--axis);stroke-width:1;visibility:hidden}
.tip{position:absolute;transform:translate(-50%,calc(-100% - 12px));background:var(--ink);color:var(--page);font-size:12px;
  padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;visibility:hidden;text-align:center}
.spark{width:56px;height:24px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600;border-top:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td small{color:var(--ink2);font-size:12px}
.card:has(table){overflow-x:auto}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;max-width:112px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;
  font-size:11px;color:var(--muted);text-decoration:none}
nav a.on{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 20px));max-height:calc(100dvh - 24px);
  background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
dialog header{display:flex;align-items:center;padding:14px 16px 6px}
dialog header h2{flex:1;margin:0;font-size:18px;color:var(--ink)}
.x{background:none;border:0;font-size:18px;color:var(--ink2);padding:8px;cursor:pointer}
.fbody{padding:6px 16px 10px;overflow:auto}
dialog footer{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--border)}
.sp{flex:1}
.f{display:block;margin-bottom:10px}
.f>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:3px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--axis);border-radius:10px;background:var(--page);color:var(--ink);min-height:44px}
textarea{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.labrow{border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:8px}
.lr1{display:flex;gap:4px;margin-bottom:6px}
.lr1 select{flex:1;min-width:0;font-weight:600}
.lr2{display:grid;grid-template-columns:1fr 1.3fr .95fr .95fr;gap:6px}
.lr2 input,.lr2 select{padding:8px 6px;font-size:14px;min-width:0}
.labrow .rm{background:none;border:0;color:var(--ink2);font-size:16px;width:40px;flex:none;cursor:pointer}
.err{color:var(--danger);font-size:14px;margin:0;padding:0 16px 8px}
@media print{
  nav,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.list{border-color:#ccc;break-inside:avoid}
}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#labs" data-tab="labs"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7.5 15h9"/></svg>Labs</a>
  <a href="#meds" data-tab="meds"><svg viewBox="0 0 24 24"><path d="M10.5 20.5a5 5 0 0 1-7-7l7-7a5 5 0 0 1 7 7zM7 10l7 7"/></svg>Meds</a>
  <a href="#body" data-tab="body"><svg viewBox="0 0 24 24"><path d="M3 16l5-5 4 3 8-9M3 21h18"/></svg>Body</a>
  <a href="#more" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>More</a>
</nav>
<dialog id="dlg"></dialog>

<script>
'use strict';
/* ---------- test catalog (English · Lithuanian name as printed on local reports) ---------- */
const CATALOG=[
 ['Androgens',[
  ['t_total','Total testosterone','Testosteronas',['nmol/L','ng/dL','ng/mL']],
  ['t_free','Free testosterone','Laisvas testosteronas',['pmol/L','pg/mL']],
  ['shbg','SHBG','LHSG – lytinius hormonus surišantis globulinas',['nmol/L']],
  ['dheas','DHEA-S','Dehidroepiandrosterono sulfatas',['µmol/L','µg/dL']],
  ['androst','Androstenedione','Androstendionas',['nmol/L','ng/mL']],
  ['ohp17','17-OH progesterone','17-OH progesteronas',['nmol/L','ng/mL']]]],
 ['Reproductive hormones',[
  ['lh','LH','Liuteinizuojantis hormonas',['IU/L']],
  ['fsh','FSH','Folikulus stimuliuojantis hormonas',['IU/L']],
  ['e2','Estradiol','Estradiolis',['pmol/L','pg/mL']],
  ['prog','Progesterone','Progesteronas',['nmol/L','ng/mL']],
  ['amh','AMH','Anti-Miulerio hormonas',['ng/mL','pmol/L']],
  ['prl','Prolactin','Prolaktinas',['mIU/L','ng/mL']]]],
 ['Thyroid',[
  ['tsh','TSH','TTH – tirotropinis hormonas',['mIU/L']],
  ['ft4','Free T4','Laisvas tiroksinas (FT4)',['pmol/L']]]],
 ['Glucose and insulin',[
  ['glu','Fasting glucose','Gliukozė (nevalgius)',['mmol/L']],
  ['ins','Fasting insulin','Insulinas',['mU/L','pmol/L']],
  ['hba1c','HbA1c','Glikuotas hemoglobinas',['%','mmol/mol']],
  ['glu120','Glucose 2 h (OGTT)','GTM – gliukozė po 2 val.',['mmol/L']]]],
 ['Lipids',[
  ['chol','Total cholesterol','Bendras cholesterolis',['mmol/L']],
  ['hdl','HDL cholesterol','DTL cholesterolis',['mmol/L']],
  ['ldl','LDL cholesterol','MTL cholesterolis',['mmol/L']],
  ['tg','Triglycerides','Trigliceridai',['mmol/L']]]],
 ['Other',[
  ['vitd','Vitamin D (25-OH)','Vitaminas D',['nmol/L','ng/mL']],
  ['b12','Vitamin B12','Vitaminas B12',['pmol/L','pg/mL']],
  ['ferr','Ferritin','Feritinas',['µg/L']],
  ['alt','ALT','ALT – alanininė aminotransferazė',['U/L']],
  ['crp','CRP','CRB – C reaktyvusis baltymas',['mg/L']],
  ['cort','Cortisol','Kortizolis',['nmol/L']]]]
];
const CALC={
 homa:{name:'HOMA-IR',unit:'',desc:'Fasting glucose (mmol/L) × fasting insulin (mU/L) ÷ 22.5, from results taken on the same day. An estimate of insulin resistance: higher means more resistance. Cut-offs vary between labs and populations, so read it with your doctor.'},
 lhfsh:{name:'LH : FSH ratio',unit:'',desc:'LH ÷ FSH from results taken on the same day. Most meaningful on cycle days 2–5.'},
 fai:{name:'Free androgen index',unit:'%',desc:'Total testosterone (nmol/L) ÷ SHBG (nmol/L) × 100, from results taken on the same day. An estimate of how much testosterone is biologically active.'}
};
const LABS=['Synlab','Antėja','Medicina practica','Rezus.lt','Poliklinika'];
const NOTE_TYPES=['Doctor visit','Ultrasound','Symptom','Other'];
const PANELS={
 hormones:['Hormones',['t_total','shbg','dheas','lh','fsh','e2','prl','amh']],
 metabolic:['Glucose and insulin',['glu','ins','hba1c']],
 lipids:['Lipids',['chol','hdl','ldl','tg']],
 other:['Thyroid and vitamins',['tsh','ft4','vitd','b12','ferr']]
};
/* names used to recognise tests in pasted report text; checked in this order, more specific first */
const ALIASES=[
 ['t_free',['laisvas testosteronas','laisvasis testosteronas','testosteronas laisvas','free testosterone']],
 ['t_total',['testosteronas','testosterone']],
 ['shbg',['lytinius hormonus surisantis globulinas','seksualinius hormonus surisantis globulinas','shbg','lhsg']],
 ['dheas',['dehidroepiandrosterono sulfatas','dhea-so4','dhea-s','dheas','dhea']],
 ['androst',['androstendionas','androstenedione']],
 ['ohp17',['17-oh progesteronas','17-oh-progesteronas','17 oh progesteronas','17-hidroksiprogesteronas','17-oh progesterone','17-ohp']],
 ['prog',['progesteronas','progesterone']],
 ['lh',['liuteinizuojantis hormonas','liutropinas','lh']],
 ['fsh',['folikulus stimuliuojantis hormonas','folitropinas','fsh']],
 ['e2',['estradiolis','estradiol','e2']],
 ['amh',['anti-miulerio hormonas','antimiulerio hormonas','anti-mullerian hormone','amh']],
 ['prl',['prolaktinas','prolactin']],
 ['tsh',['tirotropinis hormonas','tirotropinas','tth','tsh']],
 ['ft4',['laisvas tiroksinas','laisvasis tiroksinas','free t4','ft4','lt4']],
 ['glu120',['gliukoze po 2 val','po 2 val']],
 ['glu',['gliukoze','gliukozes','glucose']],
 ['ins',['insulinas','insulin']],
 ['hba1c',['glikuotas hemoglobinas','glikozilintas hemoglobinas','hba1c']],
 [null,['ne-dtl cholesterolis','ne dtl cholesterolis','ne-dtl','non-hdl cholesterol','non-hdl']], // recognised only so it is not mistaken for HDL
 ['hdl',['dtl cholesterolis','dtl-cholesterolis','dtl cholesterolio','dtl-cholesterolio','hdl cholesterol','dtl','hdl']],
 ['ldl',['mtl cholesterolis','mtl-cholesterolis','mtl cholesterolio','mtl-cholesterolio','ldl cholesterol','mtl','ldl']],
 ['chol',['bendras cholesterolis','bendrasis cholesterolis','cholesterolis','cholesterolio','total cholesterol','cholesterol']],
 ['tg',['trigliceridai','triglycerides']],
 ['vitd',['25-oh vitaminas d','vitaminas d','vitamino d','vitamin d','25-oh-d']],
 ['b12',['b12']],
 ['ferr',['feritinas','ferritin']],
 ['alt',['alanininaminotransferaze','alat','alt','gpt']],
 ['crp',['c reaktyvusis baltymas','c reaktyvus baltymas','crb','crp']],
 ['cort',['kortizolis','cortisol']]
];
const UNIT_EQ={'µiu/ml':['mU/L','mIU/L'],'uiu/ml':['mU/L','mIU/L'],'miu/l':['mIU/L','mU/L'],'mu/l':['mU/L','mIU/L'],'miu/ml':['IU/L'],'iu/l':['IU/L'],'u/l':['IU/L','U/L'],
 'ng/ml':['ng/mL','µg/L'],'µg/l':['µg/L','ng/mL'],'ug/l':['µg/L','ng/mL'],'ug/dl':['µg/dL'],'umol/l':['µmol/L']};

/* ---------- storage ---------- */
const KEY='health-tracker-v1';
const blank=()=>({version:1,settings:{heightCm:null,lastBackup:null},labs:[],customTests:[],meds:[],taken:{},body:[],periods:[],notes:[]});
let db=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return r&&r.version?Object.assign(blank(),r):blank()}catch(e){return blank()}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save: this browser is blocking storage.')}}
function save(){saveLocal();queueFolderWrite()}
const anyData=()=>!!(db.labs.length||db.meds.length||db.body.length||db.periods.length||db.notes.length);

/* ---------- backup folder: a copy of everything in a folder the user picks (browsers with the File System Access API) ---------- */
const FS_OK='showDirectoryPicker' in window,DATA_FILE='health-tracker-data.json';
const CAN_SHARE=(()=>{try{return!!navigator.canShare&&navigator.canShare({files:[new File(['{}'],'b.txt',{type:'text/plain'})]})}catch(e){return false}})();
// state: unsupported | none | prompt (permission must be re-granted) | ok | error
const folder={handle:null,state:FS_OK?'none':'unsupported',saved:localStorage.getItem(KEY+'-folder-saved'),error:''};
function idb(mode,fn){return new Promise((res,rej)=>{const o=indexedDB.open('health-tracker',1);
  o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onerror=()=>rej(o.error);
  o.onsuccess=()=>{const tx=o.result.transaction('kv',mode),r=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(r.result);tx.onerror=()=>rej(tx.error)}})}
async function readFolderFile(h){
  try{const f=await(await h.getFileHandle(DATA_FILE)).getFile(),o=JSON.parse(await f.text());
    return o&&o.version&&Array.isArray(o.labs)?{data:o,when:new Date(f.lastModified)}:null}catch(e){return null}
}
async function writeFile(h,name,text){const w=await(await h.getFileHandle(name,{create:true})).createWritable();await w.write(text);await w.close()}
let folderTimer=0;
function queueFolderWrite(){if(folder.state!=='ok'&&folder.state!=='error')return;clearTimeout(folderTimer);folderTimer=setTimeout(writeFolder,600)}
async function writeFolder(){
  if(!folder.handle||!anyData())return; // never overwrite a backup with an empty tracker
  try{const text=JSON.stringify(db,null,1);
    await writeFile(folder.handle,DATA_FILE,text);
    await writeFile(folder.handle,'health-tracker-'+today().slice(0,7)+'.json',text);
    folder.state='ok';folder.error='';folder.saved=new Date().toISOString();localStorage.setItem(KEY+'-folder-saved',folder.saved);
  }catch(e){folder.state='error';folder.error=String(e.message||e)}
  if(['home','settings'].includes(route()[0])&&!$('#dlg').open)render();
}
async function syncFolder(){ // the folder has just become writable
  if(anyData()){await writeFolder();return}
  const ex=await readFolderFile(folder.handle);if(ex){db=Object.assign(blank(),ex.data);saveLocal()}
}
async function setFolder(h){
  const ex=await readFolderFile(h);
  if(ex&&anyData()&&JSON.stringify(ex.data)!==JSON.stringify(db)&&
    confirm('This folder already contains tracker data, saved '+ex.when.toLocaleDateString('en-GB')+'.\n\nOK: load the data from the folder onto this device (replaces what is here now).\nCancel: keep the data on this device and overwrite the folder.')){
    db=Object.assign(blank(),ex.data);saveLocal();
  }
  folder.handle=h;folder.state='ok';folder.error='';
  await idb('readwrite',st=>st.put(h,'dir'));
  await syncFolder();render();
}
async function initFolder(){
  if(!FS_OK)return;
  try{const h=await idb('readonly',st=>st.get('dir'));if(!h)return;
    folder.handle=h;
    folder.state=(await h.queryPermission({mode:'readwrite'}))==='granted'?'ok':'prompt';
    if(folder.state==='ok')await syncFolder();
  }catch(e){}
  render();
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const days=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const fmtDate=s=>s?toDate(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const fmtShort=s=>toDate(s).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
const fmt=v=>v==null?'':String(+(+v).toPrecision(8));
const r2=x=>+x.toFixed(2);
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/μ/g,'µ');
const num=s=>{s=String(s??'').trim().replace(',','.');if(s==='')return null;const n=Number(s);return isFinite(n)?n:NaN};
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
function testMeta(id){
  for(const[,ts]of CATALOG)for(const t of ts)if(t[0]===id)return{id,name:t[1],lt:t[2],units:t[3]};
  const c=db.customTests.find(t=>t.id===id);
  return c?{id,name:c.name,lt:'',units:c.units}:{id,name:id,lt:'',units:['']};
}
const entriesFor=id=>db.labs.filter(e=>e.test===id).sort(byDate);
function flag(e){
  if(e.refLow==null&&e.refHigh==null)return null;
  if(e.refLow!=null&&e.value<e.refLow)return'low';
  if(e.refHigh!=null&&e.value>e.refHigh)return'high';
  return'ok';
}
const flagChip=f=>f==='low'?'<span class="chip warn">↓ Below range</span>':f==='high'?'<span class="chip warn">↑ Above range</span>':f==='ok'?'<span class="chip ok">✓ In range</span>':'';
const refText=e=>e.refLow!=null&&e.refHigh!=null?fmt(e.refLow)+'–'+fmt(e.refHigh):e.refLow!=null?'> '+fmt(e.refLow):e.refHigh!=null?'< '+fmt(e.refHigh):'';
function derived(){
  const by={};db.labs.forEach(e=>{(by[e.date]=by[e.date]||{})[e.test]=e});
  const out={homa:[],lhfsh:[],fai:[]};
  Object.keys(by).sort().forEach(d=>{const r=by[d];

function chart(pts,o={}){
  if(!pts.length)return'';
  const W=340,H=190,m={l:38,r:46,t:14,b:24},unit=o.unit||'';
  const xs=pts.map(p=>+toDate(p.d));
  let x0=Math.min(...xs),x1=Math.max(...xs);
  if(x0===x1){x0-=864e5*15;x1+=864e5*15}
  const vals=pts.map(p=>p.v);if(o.lo!=null)vals.push(o.lo);if(o.hi!=null)vals.push(o.hi);
  const lo=Math.min(...vals),hi=Math.max(...vals);
  let y0=lo,y1=hi;if(y0===y1){y0-=1;y1+=1}
  const g=(y1-y0)*.12;y0-=g;y1+=g;if(lo>=0&&y0<0)y0=0;
  const step=niceStep((y1-y0)/4),dec=step<1?Math.ceil(-Math.log10(step)):0;
  const X=t=>m.l+(t-x0)/(x1-x0)*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'Trend')}">`;
  if(o.lo!=null||o.hi!=null){
    const top=Y(o.hi!=null?o.hi:y1),bot=Y(o.lo!=null?o.lo:y0);
    s+=`<rect x="${m.l}" y="${top}" width="${W-m.l-m.r}" height="${Math.max(0,bot-top)}" fill="var(--band)"/>`;
  }
  for(let v=Math.ceil(y0/step)*step;v<=y1+1e-9;v+=step)
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(dec)}</text>`;
  const P=pts.map((p,i)=>({x:+X(xs[i]).toFixed(1),y:+Y(p.v).toFixed(1),t:fmtDate(p.d)+' · '+fmt(p.v)+(unit?' '+unit:'')}));
  s+=`<line class="cross" y1="${m.t}" y2="${H-m.b}"/>`;
  if(P.length>1)s+=`<polyline points="${P.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  P.forEach((p,i)=>{if(P.length<=24||i===P.length-1)s+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`});
  const L=P[P.length-1];
  s+=`<text class="end" x="${L.x+8}" y="${L.y+4}">${fmt(pts[pts.length-1].v)}</text>`;
  if(pts.length>1&&pts[0].d!==pts[pts.length-1].d)
    s+=`<text x="${m.l}" y="${H-6}">${fmtShort(pts[0].d)}</text><text x="${W-m.r}" y="${H-6}" text-anchor="end">${fmtShort(pts[pts.length-1].d)}</text>`;
  else s+=`<text x="${L.x}" y="${H-6}" text-anchor="middle">${fmtShort(pts[0].d)}</text>`;
  s+='</svg>';
  return`<div class="chart" data-w="${W}" data-h="${H}" data-pts='${esc(JSON.stringify(P))}'>${s}<div class="tip"></div></div>`;
}
function spark(pts){
  if(pts.length<2)return'<span class="spark"></span>';

  const xy=pts.map((p,i)=>[(3+i/(pts.length-1)*(W-8)).toFixed(1),(H-4-(p.v-lo)/r*(H-8)).toFixed(1)]);

}
function chartHover(e){

  const svg=c.querySelector('svg'),r=svg.getBoundingClientRect(),W=+c.dataset.w,H=+c.dataset.h;

/* best-effort reader for text copied out of a lab report. Copying a table gives different text depending on the
   viewer, so it handles: one result per line, everything run together on one line, one table cell per line,

const NUM='\\d+(?:[.,]\\d+)?',RANGE=NUM+'\\s*[-–—]\\s*'+NUM;
const RNG=new RegExp('^[^\\d<>≤≥]{0,40}?(?:('+NUM+')\\s*[-–—]\\s*('+NUM+')|[<≤]\\s*=?\\s*('+NUM+')|[>≥]\\s*=?\\s*('+NUM+'))');
function allHits(t){ // every place a known test name occurs; where names overlap, the longer one wins
  const c=[];
  ALIASES.forEach(([id,al],pri)=>al.forEach(a=>{
    const re=new RegExp('(?<![a-z0-9])'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z0-9])','g');let m;
    while((m=re.exec(t)))c.push({id,start:m.index,end:m.index+a.length,pri});
  }));
  c.sort((x,y)=>(y.end-y.start)-(x.end-x.start)||x.pri-y.pri);
  const out=[];
  for(const h of c)if(!out.some(o=>h.start<o.end&&o.start<h.end))out.push(h);
  return out.sort((x,y)=>x.start-y.start);

function readResult(body){ // "1,60 nmol/l 0,29 - 1,67" -> value, unit as written, reference range

  if(lead&&new RegExp(NUM).test(body.slice(lead[0].length))){rg=readRange(lead[1]);body=body.slice(lead[0].length)} // range printed before the result

function normUnit(id,raw){
  if(!raw)return null;
  const us=testMeta(id).units;
  if(!/[\/%]/.test(raw)&&!us.some(u=>u.toLowerCase()===raw))return null; // "h", "l" and the like are flags, not units
  return us.find(u=>u.toLowerCase()===raw)||(UNIT_EQ[raw]||[]).find(u=>us.includes(u))||raw.replace(/l$/,'L');

function parseReport(text){

  const isCell=l=>l.length<=30&&(isNum(l)||isUnit(l)||/^[hl*!↑↓]{1,2}$/.test(l)); // a result, a unit, or a high/low flag

  for(let i=0;i<L.length;i++){
    if(!(noDigit[i]&&lineHit[i]))continue;
    let j=i;while(j<L.length&&noDigit[j]&&!isUnit(L[j]))j++;

    const K=names.length;
    if(!fits(K)){names.forEach(k=>{used[k]=true;if(lineHit[k])later(lineHit[k].id)});i=j-1;continue} // cannot line them up
    const res=names.map((k,n)=>readResult(cleanCell(L[j+n])));
    let u=j+K;
    if(L.slice(u,u+K).length===K&&L.slice(u,u+K).every(isUnit)){res.forEach((r,n)=>{if(r&&!r.unit)r.unit=L[u+n]});u+=K}
    const rng=L.slice(u,u+K).map(l=>readRange(cleanCell(l)));
    if(rng.length===K&&rng.every(Boolean)){res.forEach((r,n)=>{if(r&&r.lo===undefined){r.lo=rng[n].lo;r.hi=rng[n].hi}});u+=K}
    names.forEach((k,n)=>{const h=lineHit[k];if(h&&!seen[h.id]){if(res[n])add(h.id,res[n]);else later(h.id)}});
    for(let k=i;k<u;k++)used[k]=true;
    i=u-1;
  }
  // 2. everything else: the result follows its test name, on the same line or in the next few table cells
  hits.forEach((h,i)=>{
    if(!h.id||seen[h.id]||used[h.line])return;
    const nx=hits[i+1],parts=t.slice(h.end,nx?nx.start:t.length).split('\n');
    const tail=parts.slice(1,nx&&parts.length>1?-1:undefined),cells=[];

    if(r)add(h.id,r);else later(h.id);
  });

}

function backupCard(has,t){

function adherence(m){

    <div class="btns"><button class="btn" data-act="export">Save backup file</button><button class="btn" data-act="import">Restore from file</button></div>
    ${CAN_SHARE?'<button class="btn block" style="margin-top:8px" data-act="sharebackup">Send backup to Drive or another app</button>':''}
    <input type="file" id="file" accept=".json,.txt,application/json,text/plain" hidden>
    <button class="btn block" style="margin-top:8px" data-act="csv">Export lab results as spreadsheet (CSV)</button></div>
    <h2>Height</h2><div class="card">${field('Height (cm), used for BMI',dec('height',db.settings.heightCm))}<button class="btn" data-act="saveheight">Save height</button></div>
    <h2>Erase</h2><div class="card"><button class="btn danger" data-act="wipe">Erase all data on this device</button></div>`;
}

/* ---------- router ---------- */
const VIEWS={home:vHome,labs:vLabs,lab:vLab,meds:vMeds,body:vBody,more:vMore,period:vPeriod,notes:vNotes,summary:vSummary,settings:vSettings};
const TAB={lab:'labs',period:'more',notes:'more',summary:'more',settings:'more'};
function route(){const[v,a]=location.hash.slice(1).split('/');return VIEWS[v]?[v,a?decodeURIComponent(a):'']:['home','']}
function render(){
  const[v,a]=route();
  $('#app').innerHTML=VIEWS[v](a);
  document.querySelectorAll('#nav a').forEach(n=>n.classList.toggle('on',n.dataset.tab===(TAB[v]||v)));
}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});

/* ---------- actions ---------- */
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
const byId=(arr,id)=>arr.find(x=>x.id===id);
const ACT={
  close:()=>$('#dlg').close(),
  del:()=>{const d=$('#dlg');if(confirm('Delete this entry?')){d._del();d.close();save();if(route()[0]==='lab'&&!entriesFor(route()[1]).length)location.hash='#labs';else render()}},
  back:()=>history.length>1?history.back():(location.hash='#home'),
  addlab:()=>labForm(),addmed:()=>medForm(),addbody:()=>bodyForm(),addperiod:()=>periodForm(),addnote:()=>noteForm(),
  editlab:id=>labForm(byId(db.labs,id)),editmed:id=>medForm(byId(db.meds,id)),editbody:id=>bodyForm(byId(db.body,id)),
  editperiod:id=>periodForm(byId(db.periods,id)),editnote:id=>noteForm(byId(db.notes,id)),
  addrow:()=>$('#rows').insertAdjacentHTML('beforeend',labRow()),
  rmrow:(id,el)=>{const r=el.closest('.labrow');if(document.querySelectorAll('#rows .labrow').length>1)r.remove();else r.outerHTML=labRow()},
  take:id=>{const t=today(),a=db.taken[t]||(db.taken[t]=[]),i=a.indexOf(id);if(i<0)a.push(id);else a.splice(i,1);if(!a.length)delete db.taken[t];save();render()},
  metric:id=>{bodyMetric=id;render()},
  print:()=>window.print(),
  export:()=>{db.settings.lastBackup=today();save();download('health-tracker-backup-'+today()+'.json',JSON.stringify(db,null,1),'application/json');render()},
  import:()=>$('#file').click(),
  csv:()=>{const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
    const rows=[['date','test','lithuanian_name','value','unit','ref_low','ref_high','lab']].concat(db.labs.slice().sort(byDate).map(e=>{const m=testMeta(e.test);return[e.date,m.name,m.lt,e.value,e.unit,e.refLow,e.refHigh,e.lab]}));
    download('lab-results-'+today()+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')},
  saveheight:()=>{const n=num($('[name=height]').value);if(isNaN(n)){alert('Enter height as a number in cm.');return}db.settings.heightCm=n;save();render()},
  fill:id=>{
    const d=db.labs.map(e=>e.date).sort().pop(),ids=id==='last'?db.labs.filter(e=>e.date===d).map(e=>e.test):PANELS[id][1];
    const n=addRows(ids.map(test=>({test})));
    fillMsg(n?`Added ${n} test${n>1?'s':''}. Type the results you have; rows left empty are ignored.`:'Those tests are already in the list.')},
  showpaste:()=>{const p=$('#paste');p.hidden=!p.hidden;if(!p.hidden)$('#pastetext').focus()},
  readpaste:()=>{
    const r=parseReport($('#pastetext').value),n=r.items.length,p=r.pend.length;
    if(!n&&!p){fillMsg('No known tests found in that text. Add them by hand below.');return}
    if(r.date)$('#dlg [name=date]').value=r.date;
    addRows(r.items.concat(r.pend.map(test=>({test}))));$('#paste').hidden=true;
    fillMsg((n?`Read ${n} result${n>1?'s':''}${r.date?' and the date':''}. `:'')+
      (p?`Found ${p} ${n?'more ':''}test name${p>1?'s':''} without a result I could read safely: ${p>1?'their rows are':'its row is'} added empty for you to fill in. `:'')+
      'Check every number, unit and range against the report before saving.')},
  pickfolder:async()=>{
    try{let h;
      try{h=await showDirectoryPicker({mode:'readwrite',id:'health-tracker',startIn:'documents'})}
      catch(e){if(e.name==='AbortError')throw e;h=await showDirectoryPicker({mode:'readwrite'})}
      await setFolder(h);
    }catch(e){if(e.name!=='AbortError')alert('Could not use that folder: '+(e.message||e))}},
  reconnect:async()=>{try{if(await folder.handle.requestPermission({mode:'readwrite'})==='granted'){folder.state='ok';await syncFolder()}}catch(e){}render()},
  dropfolder:async()=>{if(!confirm('Stop saving to the folder? The files already in it are kept.'))return;
    await idb('readwrite',st=>st.delete('dir'));folder.handle=null;folder.state='none';render()},
  sharebackup:async()=>{
    try{await navigator.share({files:[new File([JSON.stringify(db,null,1)],'health-tracker-backup-'+today()+'.txt',{type:'text/plain'})],title:'Health tracker backup'});
      db.settings.lastBackup=today();save();render()}catch(e){}},
  wipe:()=>{if(confirm('Erase ALL tracker data on this device? This cannot be undone.')&&confirm('Really erase everything?')){db=blank();save();render()}}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el.dataset.id,el);
});
document.addEventListener('change',e=>{
  if(e.target.matches('#dlg select[name=test]'))onTestChange(e.target);
  if(e.target.id==='file'&&e.target.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);
        if(!o||!o.version||!Array.isArray(o.labs))throw 0;
        if(confirm('Replace everything on this device with the contents of this backup?')){db=Object.assign(blank(),o);save();render()}
      }catch(err){alert('That file is not a Health tracker backup.')}};
    r.readAsText(e.target.files[0]);
  }
});

render();
initFolder();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
